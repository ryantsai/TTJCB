<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teen Titans: Jump City Brawl</title>
<style>
@font-face{font-family:"Noto Sans TC";src:url("./noto-sans-tc.woff2?v=903d57f16244") format("woff2");font-weight:700;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#140c24;color:#f5f0df;font-family:"Noto Sans TC",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
canvas:focus-visible,#fullscreen:focus-visible{outline:2px solid #7fd8ff;outline-offset:2px}
#fullscreen{position:fixed;z-index:2;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;place-items:center;width:48px;height:48px;padding:0;border:1px solid rgba(255,255,255,.28);border-radius:12px;background:rgba(20,12,36,.54);color:#fff;opacity:.72;cursor:pointer;transition:opacity .15s,background .15s}
#fullscreen:hover,#fullscreen:focus-visible{opacity:1;background:rgba(20,12,36,.82)}
#fullscreen[hidden]{display:none}
#fullscreen svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#fullscreen .exit-icon{display:none}
#fullscreen[aria-pressed="true"] .enter-icon{display:none}
#fullscreen[aria-pressed="true"] .exit-icon{display:block}
#notice{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:32px;background:#140c24}
#notice[hidden]{display:none}
</style>
<canvas id="game" tabindex="0" aria-label="Teen Titans: Jump City Brawl"></canvas>
<button id="fullscreen" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="enter-icon" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/>
    <path class="exit-icon" d="M3 9h6V3m12 6h-6V3M3 15h6v6m12-6h-6v6"/>
  </svg>
</button>
<div id="notice" role="status">Loading…</div>
<script type="module" src="./game.js?v=903d57f16244"></script>
</html>
